name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            mailpeek/mailpeek
            ghcr.io/${{ github.repository_owner }}/mailpeek
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build -w @mailpeek/web
      - name: Cross-compile
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/mailpeek-${os}-${arch}${ext}" ./cmd/mailpeek
          done
          cp scripts/install.sh dist/install.sh
          (cd dist && sha256sum * > checksums.txt)
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  npm:
    name: npm packages
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag matches package versions
        run: |
          for pkg in packages/client packages/playwright; do
            version=$(node -p "require('./$pkg/package.json').version")
            [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "$pkg is $version, tag is $GITHUB_REF_NAME"; exit 1; }
          done
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build -w @mailpeek-dev/client -w @mailpeek-dev/playwright
      - run: npm test -w @mailpeek-dev/client
      - name: Publish (trusted publishing, skips versions already on npm)
        run: |
          for pkg in client playwright; do
            name="@mailpeek-dev/$pkg"
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published"
            else
              npm publish --provenance --access public -w "$name"
            fi
          done
