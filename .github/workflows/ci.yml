name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - name: Vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Benchmarks (smoke)
        run: go test -run '^$' -bench . -benchtime 100x ./internal/...

  node:
    name: Web UI & SDK quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (eslint + prettier)
        run: npm run lint
      - name: UI files at most 300 lines
        run: npm run ui:size
      - name: UI translations complete
        run: npm run ui:i18n
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Audit (npm)
        run: npm run audit
      - name: React Doctor (must report no issues)
        run: npm run doctor

  e2e:
    name: End-to-end
    needs: [go, node]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build release binary and SDK packages
        run: make build packages
      - run: npx playwright install --with-deps chromium
      - name: Mailpeek E2E
        working-directory: e2e
        run: npx playwright test
      - name: Playwright example
        working-directory: examples/playwright
        env:
          MAILPEEK_BINARY: ../../bin/mailpeek
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: mailpeek:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name mailpeek -p 1026:1026 -p 8026:8026 mailpeek:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' mailpeek)" = healthy ] && break
            sleep 1
          done
          docker inspect -f '{{.State.Health.Status}}' mailpeek | grep -q healthy
          curl -fsS http://localhost:8026/api/v1/health
          docker image ls mailpeek:ci
          docker stop mailpeek
